<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="left" x1="0.5" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8a817"/>
      <stop offset="60%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="right" x1="0.5" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5b723"/>
      <stop offset="60%" stop-color="#2dd4a8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <!-- Left leg -->
